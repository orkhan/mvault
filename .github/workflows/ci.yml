name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.8.6"
      - run: ruff check --output-format=github .

  test:
    name: Tests (Django + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mvault
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: mvault
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mvault"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: mvault
      DB_USER: mvault
      DB_PASSWORD: ci-password
      # Throwaway values so manage.py can import the settings; the test runner uses its own defaults.
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      MVAULT_ENCRYPTION_KEY: ci-only-key
      MVAULT_ENCRYPTION_SALT: ci-only-salt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run
      - name: Django system check
        run: python manage.py check
      - name: Tests
        run: python manage.py test --verbosity 1

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --strict

  dockerfile:
    name: Lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  shell:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          files=$(git ls-files 'docker/*.sh' 'docker/rootfs/etc/s6-overlay/scripts/*' 'docker/rootfs/etc/s6-overlay/s6-rc.d/*/run' 'install.sh' 'packaging/*.sh' 'scripts/*.sh' | sort -u)
          if [ -z "$files" ]; then echo "no shell scripts yet"; exit 0; fi
          echo "$files"
          # shellcheck disable=SC2086
          shellcheck --severity=warning $files
      - name: Proxmox helper scripts (lint and flag-mapping tests)
        run: |
          shellcheck --severity=warning -e SC1090,SC1091,SC2154,SC2034,SC2155 proxmox/ct/mvault.sh proxmox/install/mvault-install.sh proxmox/test/args-test.sh
          bash proxmox/test/args-test.sh

  docker-build:
    name: Docker build (${{ matrix.target }}, amd64, no push)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [slim, aio]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          load: true
          tags: mvault:ci-${{ matrix.target }}
          cache-from: type=gha,scope=ci-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.target }}
      - name: Smoke test (slim boots far enough to report a configuration problem)
        if: matrix.target == 'slim'
        run: |
          out=$(docker run --rm mvault:ci-slim python manage.py check_config 2>&1 || true)
          echo "$out"
          echo "$out" | grep -qiE "ImproperlyConfigured|Version:|Set DJANGO_SECRET_KEY"
