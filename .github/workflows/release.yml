name: Release

# On a v* tag: verify the tag, build the MinIO binaries from pinned upstream source, the app tarball
# and Chrome extension ZIP, checksum + attest everything, and publish a GitHub release. install.sh
# and the Proxmox installer download these assets and verify them against SHA256SUMS.
# Container images are published by docker.yml on the same tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      go: ${{ steps.v.outputs.go }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          app="$(sed -nE 's/^APP_VERSION = "([^"]+)".*/\1/p' mvault_project/settings.py)"
          if [ "$tag" != "v${app}" ]; then
            echo "::error::Tag ${tag} does not match APP_VERSION ${app} in mvault_project/settings.py"
            exit 1
          fi
          go="$(sed -nE 's/^ARG GO_IMAGE=golang:([0-9]+\.[0-9]+).*/\1/p' Dockerfile)"
          [ -n "$go" ] || { echo "::error::could not read the Go version from the Dockerfile"; exit 1; }
          echo "version=${app}" >> "$GITHUB_OUTPUT"
          echo "go=${go}" >> "$GITHUB_OUTPUT"
          case "$app" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  minio:
    name: MinIO ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.verify.outputs.go }}
          cache: false
      - name: Build MinIO from the pinned tag and commit
        run: TARGETS="${{ matrix.target }}" scripts/build-release.sh minio
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minio-${{ strategy.job-index }}
          path: |
            dist/minio-*
            dist/licenses/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [verify, minio]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: minio-*
          path: dist
          merge-multiple: true
      - name: Build app tarball, add installer, checksum
        run: |
          scripts/build-release.sh app
          scripts/build-release.sh extension
          if [ -f install.sh ]; then cp install.sh dist/install.sh; fi
          scripts/build-release.sh checksums
          ls -l dist
      - name: Release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              $0 ~ "^## \\[?" v "\\]?([ ]|$)" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > notes.md
          fi
          if [ -s notes.md ] && grep -q '[^[:space:]]' notes.md; then echo "has_notes=true" >> "$GITHUB_OUTPUT"; else echo "has_notes=false" >> "$GITHUB_OUTPUT"; fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/minio-*
            dist/mvault-*-app.tar.gz
            dist/mvault-chrome-extension-*.zip
            dist/SHA256SUMS
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: mVault ${{ needs.verify.outputs.version }}
          body_path: ${{ steps.notes.outputs.has_notes == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.has_notes != 'true' }}
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/minio-linux-amd64
            dist/minio-linux-arm64
            dist/minio-darwin-amd64
            dist/minio-darwin-arm64
            dist/mvault-${{ needs.verify.outputs.version }}-app.tar.gz
            dist/mvault-chrome-extension-${{ needs.verify.outputs.version }}.zip
            dist/install.sh
            dist/SHA256SUMS
            dist/licenses/minio-LICENSE
            dist/licenses/minio-CREDITS
